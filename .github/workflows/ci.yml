name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.0

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  mypy:
    name: Type check (mypy, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pre-existing mypy errors block hard-fail; report them but do not gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install mypy==1.15.0
          pip install -r requirements.txt

      - name: mypy
        run: mypy src

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pn_user
          POSTGRES_PASSWORD: pn_secret
          POSTGRES_DB: plan_naryad
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pn_user -d plan_naryad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Match .env.example for the DB block; conftest swaps db_name to *_test
      DB_DRIVER_NAME: postgresql+asyncpg
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: plan_naryad
      DB_USER: pn_user
      DB_PASS: pn_secret
      DB_SHOW_QUERIES: "false"
      DB_TEST_DATABASE_NAME: plan_naryad_test
      PROJECT_TITLE: "Plan-naryad API"
      PROJECT_HOST: 0.0.0.0
      PROJECT_PORT: 8090
      PROJECT_DOCS_VERSION: 1.0.0
      PROJECT_DOCS_URL: /api/openapi
      PROJECT_OPENAPI_URL: /api/openapi.json
      MAX_ITEMS_PER_CONTRACTOR: "10"
      KEYCLOAK_VERIFY_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: plan-naryad-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
