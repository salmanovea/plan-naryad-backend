repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

   # Run mypy from the local environment (not pre-commit's isolated venv) so it
  # sees the project's installed dependencies — fastapi, sqlalchemy, pydantic.
  # Without them every third-party type collapses to Any and real type errors
  # stay hidden locally while CI (which runs `mypy src` with deps installed)
  # fails. Requires `pip install -r requirements.txt -r requirements-dev.txt`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src]
